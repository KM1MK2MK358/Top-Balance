#-----------------------------------------------------------------------
#Second Code >>>>>>>>
#Inside CommandPanels/panels
#The file inside CommandPanels/panels must have the name: "search_baltop.yml"

title: 'Search'
type: dialog
has-exit-button: false
escapable: false
columns: 1
layout:
  '0':
  - label
  '1':
  - input

  '2':
  - search
  '3':
  - cancel
items:
  label:
    type: text
    name: 'Please type what you want to search for'
  input:
    type: input
    name: 'Search:'
    initial: '%player_name%'
    width: 300
  search:
    type: button
    name: '&aSearch'
    width: 200
    actions:
      commands:
        - '[chat] /baltop search %commandpanels_session_input%'
  cancel:
    type: button
    name: '&cCancel'
    width: 200
    actions:
      commands:
        - '[chat] /baltop'